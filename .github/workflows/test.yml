name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pytest

      - name: 跑纯逻辑测试（不需要模型/网络/游戏）
        working-directory: codegen
        run: pytest test_trace.py test_planner.py -v